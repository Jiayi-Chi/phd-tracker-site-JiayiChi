<title>博士申请追踪 · 需要密码</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#f4f5f7;color:#1f2328;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid #d8dee4;border-radius:12px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 4px 18px rgba(0,0,0,.06)}

input[type=password]:focus{border-color:#2f6feb;box-shadow:0 0 0 3px rgba(47,111,235,.15)}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:#424a53;margin:14px 0 18px}
button{width:100%;font-size:16px;padding:11px;border:0;border-radius:8px;background:#1f6feb;color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:#cf222e;font-size:14px;min-height:20px;margin-top:10px}.hint{font-size:12px;color:#8c959f;margin-top:14px;line-height:1.5}
</style>
