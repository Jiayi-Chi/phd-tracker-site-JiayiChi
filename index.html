<title>博士申请追踪 · 需要密码</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#f4f5f7;color:#1f2328;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid #d8dee4;border-radius:12px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 4px 18px rgba(0,0,0,.06)}

label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:#424a53;margin:14px 0 18px}
button{width:100%;font-size:16px;padding:11px;border:0;border-radius:8px;background:#1f6feb;color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:#cf222e;font-size:14px;min-height:20px;margin-top:10px}.hint{font-size:12px;color:#8c959f;margin-top:14px;line-height:1.5}
</style>

var KEY='phdtracker.key.v1';
function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function u2b(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function show(html){document.open();document.write(html);document.close()}
async function dec(key){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(P.iv)},key,b2u(P.ct));return new TextDecoder().decode(pt)}
async function derive(pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function tryStored(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s||s.salt!==P.salt)return;
 var k=await crypto.subtle.importKey('raw',b2u(s.k),{name:'AES-GCM'},false,['decrypt']);show(await dec(k))}catch(e){localStorage.removeItem(KEY)}}
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='当前浏览器不支持解密（需要 HTTPS 和较新的浏览器）。';return}
tryStored();
document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault();var b=document.getElementById('go'),e=document.getElementById('err');
 b.disabled=true;b.textContent='正在解密…';e.textContent='';
 try{var k=await derive(document.getElementById('pw').value);var html=await dec(k);
  if(document.getElementById('rem').checked){localStorage.setItem(KEY,JSON.stringify({salt:P.salt,k:u2b(await crypto.subtle.exportKey('raw',k))}))}
  show(html)}catch(x){e.textContent='密码不正确，请重试。';b.disabled=false;b.textContent='解锁'}});
})();
